name: wordwonderslink
description: "MateRueda: la ruleta de los números — Ambiente multimedia educativo para primer grado."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_database: ^11.3.5

  # ── Autenticación social ──
  google_sign_in: ^6.2.2

  # ── Gestión de estado ──
  provider: ^6.1.2

  # ── Navegación ──
  go_router: ^14.8.1

  # ── Audio (música y efectos; sin cámara ni micrófono por RNF03) ──
  just_audio: ^0.9.42

  # ── Almacenamiento Local ──
  shared_preferences: ^2.2.3

  # ── UI ──
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  auto_size_text: ^3.0.0

  # ── Utilidades ──
  uuid: ^4.5.1
  intl: ^0.19.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.2
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/materueda/
    - assets/icons/
    - assets/audio/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/materueda/logotipo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6A4C93"
  adaptive_icon_foreground: "assets/images/materueda/logotipo.png"
